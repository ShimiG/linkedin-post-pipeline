name: Draft a post

on:
  schedule:
    # Mon/Wed/Fri 06:17 UTC. GitHub may start scheduled runs a few minutes late; an off-the-hour minute helps.
    - cron: "17 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to draft"
        type: choice
        options: [auto, news, fact]
        default: auto

permissions:
  contents: read
  issues: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Draft and open a review issue
        run: python -m poster.draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_KIND: ${{ inputs.kind || 'auto' }}
          PROFILE_YML: ${{ secrets.PROFILE_YML }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          LINKEDIN_TOKEN_EXPIRES: ${{ vars.LINKEDIN_TOKEN_EXPIRES }}
