name: Publish scheduled posts

# Publishes drafts whose `/schedule dd/mm/yyyy HH:MM` time has come: a delayed /approve.
# `/schedule` switches this workflow on, and it switches itself off when no draft is waiting, so it uses no Actions
# minutes in between. Seeing it "disabled" in the Actions tab is its normal idle state.
on:
  schedule:
    # Every 15 minutes while enabled. A post goes out with the first run after its time (GitHub may start runs a few minutes late).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write   # to switch itself off

# Its own group, so a queued run here never cancels a queued review command.
concurrency:
  group: poster-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish what is due
        run: python -m poster.scheduled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
