name: Review command

# /approve, /reject, /rewrite <instruction> on an open `draft` issue; /block [site], /unblock and /example also on closed ones.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # /example saves a file to examples/
  issues: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  review:
    # Only the repo owner, only on issues (not PRs), only on drafts, only slash commands.
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      (github.event.issue.state == 'open' || startsWith(github.event.comment.body, '/block') || startsWith(github.event.comment.body, '/unblock') || startsWith(github.event.comment.body, '/example')) &&
      contains(github.event.issue.labels.*.name, 'draft') &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the command
        run: python -m poster.review
        env:
          # Passed as env vars, never interpolated into the script (no injection through comment text).
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_YML: ${{ secrets.PROFILE_YML }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
