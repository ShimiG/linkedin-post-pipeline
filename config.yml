# Pipeline settings. Secrets (API keys, LinkedIn token, your profile) are NOT here: they are GitHub repo secrets.
# Repo variables override a few of these without a commit: PUBLISH_MODE, TIMEZONE.

publish_mode: linkedin        # simulated = /approve only shows what would be posted. Set to "linkedin" (or repo variable PUBLISH_MODE) to go live.
timezone: Asia/Jerusalem            # "today" in prompts, the date "On this day" looks up, and the clock /schedule times are read in; override with repo variable TIMEZONE

# Order the automatic post kinds rotate through when no `topic` issue is waiting.
rotation: [news, fact, onthisday]

llm:
  primary: groq
  fallback: gemini
  groq_model: openai/gpt-oss-120b
  groq_url: https://api.groq.com/openai/v1/chat/completions
  gemini_model: gemini-3.5-flash-lite
  gemini_base: https://generativelanguage.googleapis.com/v1beta/models
  temperature: 0.6
  retry_temperature: 0.2
  max_attempts: 3

post:
  max_chars: 1300              # LinkedIn allows 3000; short posts read better
  max_hashtags: 3
  hook_max_chars: 140          # the first line must fit before "...see more" on phones; longer drafts are sent back
  signature: ""                # optional fixed last line, appended if missing, excluded from checks
  # Links in the post body cut reach, so the source belongs in the first comment.
  #   manual: after publishing, the issue tells you the link to paste as the first comment (works with any app)
  #   auto:   the bot comments it via the API (needs LinkedIn's partner-only Community Management API; self-serve apps get 403)
  #   off:    no source link
  source_link: manual

# The picture posted with each draft. Most get a branded card (Hebrew headline + English hook on the brand gradient);
# about one in `ai_every` gets an AI illustration of the topic instead, made by Cloudflare Workers AI (free daily
# allowance; needs the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets). Sensitive topics (politics, war,
# crime, death, sex, religion...) always get a card: see poster/images.py and prompts/image-prompt.md.
images:
  enabled: true
  ai_every: 5                  # 0 = cards only
  ai_model: "@cf/black-forest-labs/flux-1-schnell"
  ai_steps: 4
  branch: post-images          # images are committed here, not to main

# Posts about your own GitHub projects. Manual only: Actions -> Draft a post -> Run workflow -> kind "project",
# with a repo name, or leave the repo empty for a random one from this list. Never chosen by the schedule.
# Private repos need the PROJECTS_TOKEN secret (a fine-grained token with read-only Contents access to them).
projects:
  owner: ShimiG                # whose repos; defaults to this repo's owner
  repos: [youtube-music, job-search-agent-wf, is-it-real, linkedin-post-pipeline]
  cooldown_days: 60            # a random pick prefers repos without a draft in this many days

# Each post is written in English and translated. Both versions are on the draft issue.
#   separate: each language is its own LinkedIn post. /approve hebrew or /approve english posts one, and the issue stays
#             open for the other (/schedule hebrew next puts it on another day). Reaches more people than one long post.
#   combined: one post, translation first, then the English (/approve posts it).
bilingual:
  enabled: true
  publish: separate
  language: Hebrew             # the script check in guardrail.check_translation is Hebrew-specific
  headline: true               # the post opens with a short Hebrew headline about the post...
  english_marker: "*English below"   # ...then this line (combined only), then the Hebrew text
  separator: "• • •"           # line between the two versions (combined only)
  max_total_chars: 3000        # LinkedIn's limit for one post

# When posts go out, in `timezone`. /schedule <version> next picks the next slot of that version, never on the day the
# other version went out (or is scheduled). /approve in the quiet hours asks first (/approve <version> anyway posts).
# Israel works Sunday to Thursday; Sunday morning is the busiest time of the week for Hebrew posts.
posting:
  hebrew:  {days: [sun, mon, tue, wed, thu], from: "08:30", until: "10:30"}
  english: {days: [mon, tue, wed, thu], from: "09:30", until: "11:00"}   # the work week abroad starts Monday
  quiet:   {from: "fri 12:00", until: "sun 00:00"}

news:
  lookback_days: 7
  min_points: 80               # Hacker News points, a cheap "is anyone talking about this" filter
  queries: [AI, LLM, OpenAI, Anthropic, Claude, Gemini, GPT, "machine learning", "AI agents", "open source model"]
  # A story is used only when its title has one of these as a whole word (search also matches prefixes: "AI" finds "Airplanes").
  title_words: [AI, LLM, OpenAI, Anthropic, Claude, Gemini, GPT, ChatGPT, Copilot, DeepSeek, Mistral, Llama, "machine learning", "neural network", agent]
  max_candidates: 8            # stories tried, best first, until one has a readable article

# "On this day" posts: something that happened on a date in an earlier year, from Wikipedia's On this day list. The date
# is the next posting day (see posting:) after the draft is made with no other post published or scheduled on it.
# Only entries that match a keyword are used; on a date with no match the run moves on to the next kind in the rotation.
on_this_day:
  sections: [selected, events, births, deaths]   # which lists to read; on equal relevance, earlier ones win
  min_score: 1                 # a keyword in the event line counts 2, in a linked article's title or description 1
  min_years_ago: 1
  max_candidates: 5            # events tried, most relevant first, until one has enough background text
  # Whole words, plurals included. ALL-CAPS ones (AI, IBM) must match exactly; the rest ignore case.
  keywords:
    - computer
    - computing
    - computer scientist
    - computer science
    - software
    - programmer
    - programming
    - programming language
    - algorithm
    - operating system
    - database
    - compiler
    - open source
    - open-source
    - artificial intelligence
    - machine learning
    - neural network
    - chatbot
    - robot
    - robotics
    - internet
    - World Wide Web
    - web browser
    - search engine
    - email
    - microprocessor
    - transistor
    - integrated circuit
    - semiconductor
    - supercomputer
    - mainframe
    - personal computer
    - smartphone
    - video game
    - cryptography
    - cryptographer
    - hacker
    - computer virus
    - AI
    - IBM
    - ARPANET
    - ENIAC
    - Microsoft
    - Apple Inc.
    - Google
    - Intel
    - Linux
    - Unix
    - Macintosh
    - iPhone
    - Wikipedia

# Profile keys given to news, fact and "On this day" posts (your own topics get the whole profile).
general_post_profile_keys: [name, headline, focus, daily_tools]

examples:
  per_draft: 3                 # saved examples (examples/*.md) shown to the model as style references
  max_chars: 1500              # each example is trimmed to this
  copy_ngram: 8                # a draft sharing this many consecutive words with an example is rejected

review:
  reject_cooldown_days: 7      # a /reject-ed story or article may be drafted again after this many days (0 = right away). /block is forever.

linkedin:
  token_warn_days: 10          # open a reminder issue this many days before LINKEDIN_TOKEN_EXPIRES

